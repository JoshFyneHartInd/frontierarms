baseURL = '/'
languageCode = 'en-us'
title = 'Frontier Arms & Supply | Gun Store in Cheyenne, WY'
theme = 'roadster'

[services.googleAnalytics]
  ID = "G-1PJRDY5N77"

[Params]
  copyright = "Frontier Arms & Supply"
  description = "Frontier Arms & Supply is a family-owned gun store and federally licensed firearms dealer serving Cheyenne, Wyoming since 2000. We offer new and used firearms, ammunition, optics, safes, magazines, accessories, and buy, sell, trade, and special-order firearms with knowledgeable, friendly service."
  opengraph = true
  twitter_cards = true
  readmore = false
  authorbox = false
  pager = false
  customCSS = ["/css/custom.css"]
  googleFontsLink = "https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"

[Params.style.vars]
  fontFamilyPrimary = "'Noto Serif', Helvetica, Arial, sans-serif"

[Params.logo]
  subtitle = "New & Used Firearms, Ammunition & Accessories"
  title = "Frontier Arms & Supply"
  image = "img/fa-logo.webp"

[Params.sidebar]
  home = "right"   # Configure layout for home page
  list = "right"   # Configure layout for list pages
  single = "right" # Configure layout for single pages
  widgets = ["contact", "social", "links"]

